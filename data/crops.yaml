# Hand-curated crop parameter table — DRAFT (stage 0).
#
# Rules
# - Every value has a source. A block's `source` key applies to every value in it.
# - `null` means "not yet sourced". The app must treat null as unknown, never as 0.
# - No value here was typed from memory: the `fao56` blocks were transcribed from
#   the HTML tables of FAO-56 (see `sources.fao56_t12` / `sources.fao56_t22`),
#   extracted programmatically on 2026-11-03 and checked row by row. Since 2026-11-13
#   data/fao56_table12_22.yaml (scripts/extract_fao56_table12_22.py) holds the extracted
#   Tables 12 and 22; backend/tests/test_fao56_tables.py checks these blocks against it.
# - Ranges are stored as [low, high] even where FAO-56 prints them high-low
#   (e.g. maize Kc_end "0.60-0.35": higher when harvested fresh / high moisture).
# - FAO-56 Kc_ini left blank for a crop means the crop-group value applies
#   (FAO-56 Table 12 convention); those cells are marked `kc_ini_from_group: true`.
# - FAO-56 Kc values are for sub-humid climate (RHmin ~45 %, u2 ~2 m/s) and must
#   be adjusted for local RHmin/wind (FAO-56 eq. 62 / 65) — done in code, not here
#   (backend/app/features/kc_climate.py; max_height_m is the crop height h).
#
# Pending (stage 1+), all null for now:
#   temperature/rainfall optimum & absolute limits, growing-season length,
#   drought / frost / heat tolerance, organic-matter contribution, forage value,
#   pest/disease groups, FAO-56 Table 11 stage lengths.
#   FAO ECOCROP is NOT used (licence unconfirmed, see docs/DATA_SOURCES.md).
#   Decision 2026-11-03: these fields come from peer-reviewed literature,
#   with DOI + table/page per value; FAO has been asked about ECOCROP reuse.

version: 0.1-draft
sources:
  fao56_t12:
    citation: >-
      Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop
      evapotranspiration — Guidelines for computing crop water requirements.
      FAO Irrigation and Drainage Paper 56. FAO, Rome. Table 12.
    url: https://www.fao.org/4/X0490E/x0490e0b.htm
    fields: [kc_ini, kc_mid, kc_end, max_height_m]
  fao56_t22:
    citation: Allen et al. (1998), FAO-56, Table 22.
    url: https://www.fao.org/4/X0490E/x0490e0e.htm
    fields: [root_depth_m, depletion_p]
    note: depletion_p is for ETc ~5 mm/day; adjust with FAO-56 eq. 84 / Table 22 note.
  taxonomy:
    citation: Plants of the World Online (POWO), Royal Botanic Gardens, Kew. APG IV families.
    url: https://powo.science.kew.org/
    status: to_verify  # families entered from botanical knowledge; verify against POWO in stage 1
  derived_n_fixation:
    citation: >-
      Rule: Fabaceae crops form symbioses with N-fixing rhizobia. Actual fixation
      depends on inoculation, soil N and management — flagged for local checking.
    fields: [nitrogen_fixing]

